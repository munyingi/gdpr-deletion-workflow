name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit and integration tests
        run: make test
      - name: End-to-end erasure demo with restore drill and audit chain check
        run: |
          make demo | tee demo.log
          grep -q "PII hits outside backups after erasure: 0" demo.log
          grep -q "'pii_hits_after_restore': 0" demo.log
          grep -q "chain intact" demo.log
