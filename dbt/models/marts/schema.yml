version: 2
models:
  - name: fct_orders
    description: One row per order. Erased customers keep their order rows with an anonymous token.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: amount_eur
        data_tests: [not_null]
  - name: dim_customers
    description: SCD2 customer dimension.
    columns:
      - name: customer_id
        data_tests: [not_null]
  - name: mart_customer_value
    columns:
      - name: customer_id
        data_tests: [unique]
